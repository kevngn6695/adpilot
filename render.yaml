# Render Blueprint: one web service (API + built React app) and one Postgres database.
# In Render: New → Blueprint → pick this repo.
services:
  - type: web
    name: adpilot
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: adpilot-db
          property: connectionString
      - key: APP_TIMEZONE
        value: America/Los_Angeles
      # Optional: add your key in the Render dashboard for AI-written ad copy.
      - key: ANTHROPIC_API_KEY
        sync: false

databases:
  - name: adpilot-db
    plan: free
